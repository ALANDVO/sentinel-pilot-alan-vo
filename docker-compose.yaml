version: '3.8'

services:
  # PostgreSQL database (optional, for production)
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_DB: sentinel
  #     POSTGRES_USER: sentinel
  #     POSTGRES_PASSWORD: ${DB_PASSWORD}
  #   volumes:
  #     - db_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # SQLite is used by default (file-based)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=sqlite+aiosqlite:///./data/sentinel.db
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-in-production}
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=sentinel
      - KEYCLOAK_CLIENT_ID=sentinel-pilot
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - backend_data:/app/data
      - ./backend/app:/app/app:ro
    depends_on:
      - keycloak
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "127.0.0.1:5173:80"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=dev-file
    volumes:
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  backend_data:
  keycloak_data:
  # db_data: