# CI/CD Workflow
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Run backend tests
        run: |
          .venv/bin/python -m pytest tests/ -v --tb=short

      - name: Run type checking (optional)
        run: |
          .venv/bin/pip install mypy
          .venv/bin/mypy app/ --ignore-missing-imports || true

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type checking
        run: npx tsc --noEmit

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
          load: true

      - name: Build frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
          load: true

      - name: Test backend Docker image
        run: |
          docker run --rm -d --name backend-test \
            -p 8000:8000 \
            -e ENVIRONMENT=test \
            -e DEBUG=false \
            -e SECRET_KEY=test-secret \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
          sleep 5
          curl -f http://localhost:8000/api/health
          docker stop backend-test

      - name: Test frontend Docker image
        run: |
          docker run --rm -d --name frontend-test \
            -p 8080:80 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
          sleep 3
          curl -f http://localhost:8080/
          docker stop frontend-test