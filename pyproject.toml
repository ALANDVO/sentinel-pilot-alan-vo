[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-pilot-alan-vo"
version = "1.0.0"
description = "Minecraft Launcher Management Tool"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Alan Vo", email = "alanvo@gmail.com"}
]
keywords = ["minecraft", "launcher", "mod-management", "instance-management"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "python-jose[cryptography]==3.3.0",
    "python-multipart==0.0.9",
    "httpx==0.27.2",
    "sqlalchemy==2.0.34",
    "alembic==1.13.1",
    "aiosqlite==0.20.0",
    "python-dotenv==1.0.1",
    "itsdangerous==2.2.0",
    "passlib[bcrypt]==1.7.4",
    "cryptography==43.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.23.7",
    "httpx==0.27.2",
    "mypy==1.10.0",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]